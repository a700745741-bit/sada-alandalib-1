<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صدى العندليب | النظام الموحد</title><style>
:root{
    --main:#0755bd;
    --dark:#062b59;
    --bg:#f1f5fb;
    --green:#13834b;
}

*{box-sizing:border-box}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:var(--bg);
    color:#172b45;
}

header{
    background:linear-gradient(135deg,var(--dark),var(--main));
    color:white;
    padding:18px 12px;
    text-align:center;
}

header h2{margin:0 0 7px}
header p{margin:0;font-size:13px}

.tabs{
    display:flex;
    gap:8px;
    padding:10px;
    background:white;
    position:sticky;
    top:0;
    z-index:20;
}

.tab-btn{
    flex:1;
    border:0;
    border-radius:9px;
    padding:13px 7px;
    font-size:14px;
    font-weight:bold;
    background:#e8eef8;
    color:var(--dark);
}

.tab-btn.active{
    background:var(--main);
    color:white;
}

.status{
    margin:10px;
    padding:12px;
    border-radius:9px;
    background:#e5f2ff;
    color:#06447e;
    font-size:13px;
    text-align:center;
    line-height:1.8;
}

.pane{display:none;padding:0 8px 12px}
.pane.active{display:block}

.frame-wrap{
    width:100%;
    background:white;
    border-radius:10px;
    overflow:hidden;
}

iframe{
    display:block;
    width:100%;
    height:82vh;
    min-height:650px;
    border:0;
    background:white;
}

footer{
    padding:12px;
    text-align:center;
    font-size:11px;
    color:#718096;
}
</style></head><body><header>
    <h2>🏆 صدى العندليب</h2>
    <p>نظام فرز التوقعات وجدول ترتيب المشاركين</p>
</header><nav class="tabs"><button class="tab-btn active" id="sortTab">
    ⚽ فرز التوقعات
</button>

<button class="tab-btn" id="rankTab">
    🏆 جدول الترتيب
</button>

</nav><div class="status" id="status">
    جارٍ تحميل البرنامجين...
</div><section class="pane active" id="sortPane">
    <div class="frame-wrap">
        <iframe
            id="sortFrame"
            src="https://a700745741-bit.github.io/sada-alandalib/">
        </iframe>
    </div>
</section><section class="pane" id="rankPane">
    <div class="frame-wrap">
        <iframe
            id="rankFrame"
            src="https://a700745741-bit.github.io/alsharqandriod/">
        </iframe>
    </div>
</section><footer>
    صدى العندليب | النظام الموحد
</footer><script>

const sortFrame=document.getElementById("sortFrame");
const rankFrame=document.getElementById("rankFrame");

const sortTab=document.getElementById("sortTab");
const rankTab=document.getElementById("rankTab");

const sortPane=document.getElementById("sortPane");
const rankPane=document.getElementById("rankPane");

const statusBox=document.getElementById("status");

const NEW_BUTTON_TEXT =
"📥 نقل الأسماء الصحيحة إلى إضافة المشاركين بالجملة";


function setStatus(message){
    statusBox.textContent=message;
}


function showTab(which){

    const isSort=which==="sort";

    sortPane.classList.toggle("active",isSort);
    rankPane.classList.toggle("active",!isSort);

    sortTab.classList.toggle("active",isSort);
    rankTab.classList.toggle("active",!isSort);

    window.scrollTo({top:0,behavior:"smooth"});
}


sortTab.onclick=()=>showTab("sort");

rankTab.onclick=()=>{
    showTab("rank");
    setStatus("جدول الترتيب جاهز للاستخدام.");
};


function getDoc(frame){

    try{
        return frame.contentDocument ||
               frame.contentWindow.document;
    }catch(e){
        return null;
    }

}


function waitForElement(frame,id,timeout=30000){

    return new Promise((resolve,reject)=>{

        const start=Date.now();

        const timer=setInterval(()=>{

            const doc=getDoc(frame);
            const el=doc && doc.getElementById(id);

            if(el){
                clearInterval(timer);
                resolve(el);
            }

            if(Date.now()-start>timeout){
                clearInterval(timer);
                reject(new Error("لم يتم العثور على "+id));
            }

        },300);

    });

}


/* إنشاء زر النقل بالاسم الجديد */

async function addTransferButton(){

    try{

        const oldSortButton=
            await waitForElement(sortFrame,"sortBtn");

        const doc=getDoc(sortFrame);

        if(!doc)return;

        let button=doc.getElementById("sendToRankBtn");

        if(!button){

            button=doc.createElement("button");

            button.id="sendToRankBtn";
            button.type="button";

            oldSortButton.insertAdjacentElement(
                "afterend",
                button
            );

        }

        /* فرض النص الجديد في كل مرة */

        button.textContent=NEW_BUTTON_TEXT;

        button.innerText=NEW_BUTTON_TEXT;

        button.style.cssText=`
            display:block;
            width:100%;
            margin:12px 0;
            padding:15px 10px;
            border:0;
            border-radius:10px;
            background:#13834b;
            color:white;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            line-height:1.7;
        `;

        button.onclick=transferCorrectNames;

        setStatus(
            "تم تحميل الفرز. زر نقل الأسماء إلى إضافة المشاركين بالجملة جاهز."
        );

    }catch(error){

        console.error(error);

        setStatus(
            "تعذر تجهيز زر النقل. تحقق من تحميل برنامج الفرز."
        );

    }

}


/* استخراج كل الأسماء التي أصابت مباراة واحدة على الأقل */

function extractCorrectNames(){

    const expression=`

    (function(){

        if(
            typeof lastPeople==="undefined" ||
            typeof lastCorrect==="undefined"
        ){
            throw new Error("بيانات الفرز غير جاهزة");
        }

        const mode=document.getElementById("matchMode").value;

        const names=lastPeople.filter(function(p){

            return lastCorrect.some(function(cm){

                return resultKnown(cm) &&
                    isCorrect(
                        matchParticipantGame(
                            p,
                            cm,
                            mode,
                            new Set()
                        ),
                        cm
                    );

            });

        }).map(function(p){

            return String(p.name||"").trim();

        }).filter(Boolean);

        const unique=[];
        const seen=new Set();

        names.forEach(function(name){

            const key=name.toLowerCase();

            if(!seen.has(key)){
                seen.add(key);
                unique.push(name);
            }

        });

        return unique;

    })()

    `;

    return sortFrame.contentWindow.eval(expression);

}


/* نقل الأسماء إلى خانة الإضافة الجماعية فقط */

async function transferCorrectNames(){

    const doc=getDoc(sortFrame);
    const button=doc && doc.getElementById("sendToRankBtn");

    try{

        if(button){
            button.disabled=true;
            button.textContent="⏳ جارٍ تجهيز الأسماء...";
        }

        const names=extractCorrectNames();

        if(!names.length){

            alert(
                "لم يتم العثور على أسماء صحيحة. نفّذ الفرز أولاً."
            );

            return;
        }

        setStatus(
            "تم العثور على "+names.length+
            " مشاركًا. جارٍ نقلهم إلى خانة الإضافة الجماعية..."
        );

        const bulkNames=
            await waitForElement(rankFrame,"bulkNames");

        const rankDoc=getDoc(rankFrame);

        /* تعبئة خانة الأسماء فقط */

        bulkNames.value=names.join("\n");

        bulkNames.dispatchEvent(
            new Event("input",{bubbles:true})
        );

        bulkNames.dispatchEvent(
            new Event("change",{bubbles:true})
        );

        /* الانتقال إلى تبويب الجدول */

        showTab("rank");

        setStatus(
            "✅ تم نقل "+names.length+
            " اسمًا إلى خانة إضافة المشاركين بالجملة. حدد النقاط ثم اضغط فرز وإضافة."
        );

        const pointsInput=
            rankDoc.getElementById("bulkPoints");

        if(pointsInput){

            setTimeout(()=>{
                pointsInput.focus();
                pointsInput.select();
            },500);

        }else{
            bulkNames.focus();
        }

        alert(
            "تم نقل "+names.length+" اسمًا بنجاح.\n\n"+
            "الأسماء موجودة في خانة إضافة المشاركين بالجملة.\n\n"+
            "1- حدد النقاط.\n"+
            "2- اضغط زر فرز وإضافة.\n\n"+
            "سيقوم البرنامج الأصلي بإضافة المشاركين وتحديث نقاطهم وترتيب الجدول."
        );

    }catch(error){

        console.error(error);

        alert(
            "حدث خطأ أثناء النقل. تأكد من تحميل البرنامجين."
        );

        setStatus("تعذر إتمام النقل.");

    }finally{

        if(button){
            button.disabled=false;
            button.textContent=NEW_BUTTON_TEXT;
            button.innerText=NEW_BUTTON_TEXT;
        }

    }

}


/* تحميل البرنامجين */

sortFrame.addEventListener("load",()=>{
    addTransferButton();
});

rankFrame.addEventListener("load",()=>{
    setStatus("تم تحميل جدول الترتيب.");
});

/* إعادة فرض الاسم الجديد احتياطياً */

setInterval(()=>{

    const doc=getDoc(sortFrame);

    const button=doc &&
        doc.getElementById("sendToRankBtn");

    if(button){
        button.textContent=NEW_BUTTON_TEXT;
        button.innerText=NEW_BUTTON_TEXT;
    }

},2000);

setTimeout(addTransferButton,1500);

</script></body>
</html>
