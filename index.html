<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صدى العندليب | النظام الموحد</title><style>
:root{
    --main:#0755bd;
    --dark:#062b59;

    --white:#fff;
    --bg:#f1f5fb;
    --green:#13834b;
}

    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:var(--bg);
    color:#172b45;
}

header{
    background:linear-gradient(135deg,var(--dark),var(--main));
    color:white;
    padding:17px 12px;
    text-align:center;
    box-shadow:0 3px 12px #0002;
}

header h2{
    margin:0 0 7px;
    font-size:22px;
}

header p{
    margin:0;
    font-size:13px;
    opacity:.9;
}

.tabs{
    display:flex;
    gap:8px;
    padding:10px;
    background:white;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 2px 7px #0001;
}

.tab-btn{
    flex:1;
    border:0;
    border-radius:9px;
    padding:13px 7px;
    font-size:15px;
    font-weight:bold;
    background:#e8eef8;
    color:var(--dark);
    cursor:pointer;
}

.tab-btn.active{
    background:var(--main);
    color:white;
}

.status{
    margin:10px;
    padding:11px;
    border-radius:9px;
    background:#e5f2ff;
    color:#06447e;
    font-size:13px;
    text-align:center;
    line-height:1.7;
}

.pane{
    display:none;
    padding:0 8px 12px;
}

.pane.active{
    display:block;
}

.frame-wrap{
    width:100%;
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 2px 10px #0001;
}

iframe{
    display:block;
    width:100%;
    height:82vh;
    min-height:650px;
    border:0;
    background:white;
}

footer{
    padding:12px;
    text-align:center;
    font-size:11px;
    color:#718096;
}

@media(max-width:600px){
    header h2{
        font-size:19px;
    }

    .tab-btn{
        font-size:13px;
        padding:12px 4px;
    }

    iframe{
        height:80vh;
        min-height:600px;
    }
}
</style></head><body><header>
    <h2>🏆 صدى العندليب</h2>
    <p>نظام فرز التوقعات وجدول ترتيب المشاركين</p>
</header><nav class="tabs">
    <button class="tab-btn active" id="sortTab">
        ⚽ فرز التوقعات
    </button><button class="tab-btn" id="rankTab">
    🏆 جدول الترتيب
</button>

</nav><div class="status" id="status">
    جارٍ تحميل البرنامجين...
</div><section class="pane active" id="sortPane">
    <div class="frame-wrap">
        <iframe
            id="sortFrame"
            src="https://a700745741-bit.github.io/sada-alandalib/">
        </iframe>
    </div>
</section><section class="pane" id="rankPane">
    <div class="frame-wrap">
        <iframe
            id="rankFrame"
            src="https://a700745741-bit.github.io/alsharqandriod/">
        </iframe>
    </div>
</section><footer>
    صدى العندليب | النظام الموحد
</footer><script>
const sortFrame = document.getElementById("sortFrame");
const rankFrame = document.getElementById("rankFrame");

const sortTab = document.getElementById("sortTab");
const rankTab = document.getElementById("rankTab");

const sortPane = document.getElementById("sortPane");
const rankPane = document.getElementById("rankPane");

const statusBox = document.getElementById("status");

let sortButtonAdded = false;

function setStatus(message){
    statusBox.textContent = message;
}

function showTab(which){

    const isSort = which === "sort";

    sortPane.classList.toggle("active",isSort);
    rankPane.classList.toggle("active",!isSort);

    sortTab.classList.toggle("active",isSort);
    rankTab.classList.toggle("active",!isSort);

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

sortTab.addEventListener("click",()=>{
    showTab("sort");
});

rankTab.addEventListener("click",()=>{
    showTab("rank");
    setStatus("يمكنك استخدام جدول الترتيب بصورة مستقلة أو استقبال الأسماء المنقولة إليه.");
});


function getFrameDocument(frame){
    try{
        return frame.contentDocument ||
               frame.contentWindow.document;
    }catch(error){
        return null;
    }
}


function waitForElement(frame,id,timeout=30000){

    return new Promise((resolve,reject)=>{

        const start = Date.now();

        const timer = setInterval(()=>{

            const doc = getFrameDocument(frame);

            if(doc){

                const element = doc.getElementById(id);

                if(element){
                    clearInterval(timer);
                    resolve(element);
                    return;
                }
            }

            if(Date.now()-start > timeout){
                clearInterval(timer);
                reject(new Error("انتهت مهلة انتظار العنصر: "+id));
            }

        },300);

    });
}


/* إضافة زر النقل داخل برنامج الفرز الأصلي */

async function addTransferButton(){

    if(sortButtonAdded) return;

    try{

        const originalSortButton =
            await waitForElement(sortFrame,"sortBtn");

        const doc = getFrameDocument(sortFrame);

        if(!doc) return;

        const button = doc.createElement("button");

        button.id = "sendToRankBtn";
        button.type = "button";

        button.textContent =
            "📥 نقل الأسماء الصحيحة إلى جدول الترتيب";

        button.style.cssText = `
            display:block;
            width:100%;
            margin:12px 0;
            padding:15px 10px;
            border:0;
            border-radius:10px;
            background:#13834b;
            color:white;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            box-shadow:0 3px 8px #0002;
        `;

        originalSortButton.insertAdjacentElement(
            "afterend",
            button
        );

        button.addEventListener("click",transferCorrectNames);

        sortButtonAdded = true;

        setStatus("تم تحميل برنامج الفرز. بعد الفرز يمكنك نقل الأسماء الصحيحة إلى جدول الترتيب.");

    }catch(error){

        setStatus(
            "تعذر الوصول إلى زر الفرز. تأكد من تحميل البرنامج الأصلي."
        );

        console.error(error);
    }
}


/* استخراج جميع المشاركين الذين أصابوا مباراة واحدة على الأقل */

function extractCorrectNames(){

    const win = sortFrame.contentWindow;

    const expression = `
        (function(){

            if(
                typeof lastPeople === "undefined" ||
                typeof lastCorrect === "undefined"
            ){
                throw new Error("بيانات الفرز غير جاهزة");
            }

            const mode =
                document.getElementById("matchMode").value;

            const names = lastPeople.filter(function(p){

                return lastCorrect.some(function(cm){

                    return resultKnown(cm) &&
                        isCorrect(
                            matchParticipantGame(
                                p,
                                cm,
                                mode,
                                new Set()
                            ),
                            cm
                        );

                });

            }).map(function(p){
                return String(p.name || "").trim();
            }).filter(Boolean);

            const unique = [];
            const seen = new Set();

            names.forEach(function(name){

                const key = name.toLowerCase();

                if(!seen.has(key)){
                    seen.add(key);
                    unique.push(name);
                }

            });

            return unique;

        })()
    `;

    return win.eval(expression);
}


/* نقل الأسماء إلى خانة الإضافة الجماعية */

async function transferCorrectNames(){

    const button =
        getFrameDocument(sortFrame).getElementById("sendToRankBtn");

    try{

        if(button){
            button.disabled = true;
            button.textContent = "⏳ جارٍ تجهيز الأسماء...";
        }

        const names = extractCorrectNames();

        if(!names || names.length === 0){

            alert(
                "لم يتم العثور على أسماء أصابت مباراة واحدة على الأقل.\nتأكد من تنفيذ الفرز وإدخال نتائج المباريات."
            );

            if(button){
                button.disabled = false;
                button.textContent =
                    "📥 نقل الأسماء الصحيحة إلى جدول الترتيب";
            }

            return;
        }

        setStatus("تم العثور على "+names.length+" مشاركًا. جارٍ فتح جدول الترتيب...");

        const bulkNames =
            await waitForElement(rankFrame,"bulkNames");

        const rankDoc = getFrameDocument(rankFrame);

        bulkNames.value = names.join("\n");

        bulkNames.dispatchEvent(
            new Event("input",{bubbles:true})
        );

        bulkNames.dispatchEvent(
            new Event("change",{bubbles:true})
        );

        showTab("rank");

        setStatus(
            "✅ تم نقل "+names.length+
            " اسمًا إلى خانة الإضافة الجماعية. حدد النقاط ثم اضغط «فرز وإضافة»."
        );

        const pointsInput =
            rankDoc.getElementById("bulkPoints");

        if(pointsInput){

            setTimeout(()=>{
                pointsInput.focus();
                pointsInput.select();
            },500);

        }else{
            bulkNames.focus();
        }

        alert(
            "تم نقل "+names.length+" اسمًا بنجاح.\n\n"+
            "الخطوة التالية:\n"+
            "1- حدد عدد النقاط لكل اسم.\n"+
            "2- اضغط زر «فرز وإضافة» في جدول الترتيب.\n\n"+
            "سيقوم البرنامج الأصلي بتحديث النقاط وإعادة ترتيب المشاركين."
        );

    }catch(error){

        console.error(error);

        alert(
            "حدث خطأ أثناء نقل الأسماء.\n"+
            "تأكد من أن برنامج جدول الترتيب قد تم تحميله."
        );

        setStatus("تعذر إتمام النقل. راجع تحميل البرنامجين.");

    }finally{

        if(button){
            button.disabled = false;
            button.textContent =
                "📥 نقل الأسماء الصحيحة إلى جدول الترتيب";
        }

    }
}


/* مراقبة تحميل برنامج الفرز */

sortFrame.addEventListener("load",()=>{
    addTransferButton();
});


/* مراقبة تحميل برنامج الترتيب */

rankFrame.addEventListener("load",()=>{

    setStatus(
        "تم تحميل جدول الترتيب. يمكنك استخدامه مباشرة أو استقبال الأسماء من برنامج الفرز."
    );

});


/* محاولة إضافية في حال كان البرنامج قد حُمّل قبل تشغيل المراقبة */

setTimeout(()=>{
    addTransferButton();
},1500);

</script></body>
</html>
