<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صدى العندليب | النظام الموحد</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --main: #0755bd;
            --dark: #062b59;
            --light: #eaf2ff;
            --white: #fff;
            --bg: #f1f5fb;
            --green: #13834b;
            --gold: #ffd700;
        }
        
        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: var(--bg);
            color: #172b45;
        }
        
        header {
            background: linear-gradient(135deg, #001b4b, #0755bd, #001b4b);
            color: white;
            padding: 22px 12px;
            text-align: center;
            box-shadow: 0 3px 12px #0002;
            border-bottom: 4px solid var(--gold);
        }
        
        header h1 { margin: 0 0 8px; font-size: 27px; }
        header p { margin: 0; font-size: 14px; opacity: .95; }

        /* التبويبات */
        .tabs {
            display: flex;
            gap: 8px;
            padding: 10px;
            background: white;
            position: sticky;
            top: 0;
            z-index: 20;
            box-shadow: 0 2px 7px #0001;
        }
        
        .tab-btn {
            flex: 1;
            border: 0;
            border-radius: 9px;
            padding: 14px 7px;
            font-size: 15px;
            font-weight: bold;
            background: #e8eef8;
            color: var(--dark);
            cursor: pointer;
        }
        
        .tab-btn.active {
            background: var(--main);
            color: white;
        }

        /* المحتوى */
        .pane { display: none; padding: 15px; }
        .pane.active { display: block; }

        /* تصميم المربعات */
        .box {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px #0001;
            border: 1px solid #dce7f7;
        }
        
        .box h3 { margin-top: 0; color: var(--main); }
        
        input[type="text"], input[type="number"], textarea {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            font-family: inherit;
        }
        
        .btn {
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            color: #fff;
            width: 100%;
            margin-top: 5px;
        }
        .btn-green { background-color: var(--green); }
        .btn-gold { background-color: var(--gold); color: #000; }
        .btn-blue { background-color: var(--main); }
        .btn-red { background-color: #dc3545; }
        .btn-purple { background-color: #6f42c1; }
        .btn-whatsapp { background-color: #25D366; color: #fff; font-size: 16px;} /* لون الواتساب */

        .flex-row { display: flex; gap: 5px; }
        .flex-row input { flex: 1; }

        /* لوحة الألوان */
        .color-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .color-box {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #eee;
        }
        .color-box label { display: block; font-size: 12px; margin-bottom: 5px; }
        .color-box input[type="color"] { width: 100%; height: 40px; border: none; cursor: pointer; }

        /* تصميم الجدول */
        .table-wrapper { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            background: white;
        }
        th { 
            background-color: var(--main); 
            color: white; 
            padding: 10px; 
            border: 1px solid #ddd;
        }
        td { 
            padding: 5px; 
            border: 1px solid #ddd;
            font-weight: bold; 
        }
        
        .edit-input {
            width: 100%;
            background: transparent;
            border: 1px solid transparent;
            color: inherit;
            font-family: inherit;
            font-weight: bold;
            font-size: 15px;
            text-align: center;
            padding: 8px 2px;
            margin: 0;
            box-sizing: border-box;
            outline: none;
            border-radius: 5px;
        }
        .edit-input:focus {
            border-color: var(--main);
            background: #f0f8ff;
        }
        .name-input { text-align: right; font-size: 16px; }
        .points-input {
            background-color: var(--gold);
            color: #000;
            font-size: 18px;
            text-align: center;
            font-weight: 900;
            border-radius: 8px;
        }

        /* قائمة الفرز */
        .parsed-list {
            max-height: 300px;
            overflow-y: auto;
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            display: none;
        }
        .parsed-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }
        .parsed-item:last-child { border-bottom: none; }
        .parsed-item input {
            width: 80px;
            padding: 5px;
            text-align: center;
            font-weight: bold;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        
        .delete-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 8px;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        footer {
            padding: 16px;
            text-align: center;
            font-size: 12px;
            color: #718096;
        }

        @media(max-width:600px){
            header h1{font-size:22px}  
            .tab-btn{font-size:13px;padding:12px 4px}  
        }
    </style>
</head>
<body>

<header>
    <h1>🏆 صدى العندليب 🏆</h1>
    <p>النظام الموحد لفرز التوقعات وجدول الترتيب</p>
</header>

<!-- التبويبات -->
<nav class="tabs">
    <button class="tab-btn active" id="sortTab" onclick="showTab('sort')">
        📋 فرز وإضافة التوقعات
    </button>
    <button class="tab-btn" id="rankTab" onclick="showTab('rank')">
        🏆 جدول الترتيب
    </button>
</nav>

<!-- التبويب الأول: إدخال التوقعات -->
<section class="pane active" id="sortPane">
    <div class="box">
        <h3>➕ إضافة اسم واحد (يدوي)</h3>
        <div class="flex-row">
            <input type="text" id="inputName" placeholder="اسم المشترك">
            <input type="number" id="inputPoints" placeholder="النقاط" value="0">
        </div>
        <button class="btn btn-gold" onclick="addName()">إضافة مباشرة</button>
    </div>

    <div class="box">
        <h3>📋 لصق أسماء (توقعات صحيحة)</h3>
        <p style="font-size: 12px; color: #666;">الصق الأسماء مفصولة بفاصلة (،) أو سطر.</p>
        <textarea id="bulkNames" placeholder="مثال: سامي حاج باضريس، عبد الرحمن محمد باعباد..."></textarea>
        <button class="btn btn-blue" onclick="parseNames()">🔍 فرز الأسماء وإظهارها</button>

        <!-- حاوية النتائج -->
        <div id="parsedContainer" class="parsed-list">
            <h4 style="margin-top: 0; text-align: center; color: var(--main);">الأسماء المكتشفة:</h4>
            <div id="parsedItems"></div>
            
            <div class="flex-row" style="margin-top: 10px;">
                <input type="number" id="defaultPoints" placeholder="النقاط الافتراضية" value="3" style="flex: 1;">
                <button class="btn btn-green" onclick="applyParsedNames()">✅ إضافة للجدول</button>
            </div>
        </div>
        
        <!-- زر التهنئة (خارج القائمة ليكون ظاهراً دائماً) -->
        <button class="btn btn-whatsapp" id="whatsappCongratsBtn" style="margin-top: 15px; display: none;" onclick="sendCongratulations()">
            🎉 إرسال تهنئة عبر الواتساب
        </button>
    </div>
</section>

<!-- التبويب الثاني: جدول الترتيب -->
<section class="pane" id="rankPane">
    
    <!-- لوحة الألوان -->
    <div class="box">
        <h3>🎨 تغيير الألوان</h3>
        <div class="color-grid">
            <div class="color-box"><label>خلفية الصفحة</label><input type="color" id="c-page" onchange="changeColor('bg-page', this.value)"></div>
            <div class="color-box"><label>خلفية الجدول</label><input type="color" id="c-table" onchange="changeColor('bg-table', this.value)"></div>
            <div class="color-box"><label>خلفية الصفوف</label><input type="color" id="c-row" onchange="changeColor('bg-row', this.value)"></div>
            <div class="color-box"><label>مربع النقاط</label><input type="color" id="c-points" onchange="changeColor('bg-points', this.value)"></div>
        </div>
    </div>

    <!-- أزرار التحكم -->
    <div class="box" style="text-align: center;">
        <button class="btn btn-green" style="margin-bottom: 5px;" onclick="saveData(true)">💾 حفظ التعديلات</button>
        <button class="btn btn-blue" style="margin-bottom: 5px;" onclick="shareWhatsApp()">📱 مشاركة جدول الترتيب عبر واتساب</button>
        <button class="btn btn-red" style="margin-bottom: 5px;" onclick="resetPoints()">🔄 تصفير جميع النقاط</button>
        <button class="btn btn-red" onclick="clearAll()">🗑️ مسح جميع الأسماء</button>
    </div>

    <!-- الجدول -->
    <div class="box" style="padding: 5px;">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th style="width: 10%;">#</th>
                        <th style="width: 40%;">الاسم</th>
                        <th style="width: 25%;">النقاط</th>
                        <th style="width: 25%;">حذف</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- سيتم تعبئة الجدول هنا -->
                </tbody>
            </table>
        </div>
        <h3 id="total" style="margin-top: 15px; text-align: center;">إجمالي المشاركين: 0</h3>
    </div>
</section>

<footer>
    🏆 صدى العندليب .. حيث يلتقي الشغف بالإبداع 🏆
</footer>

<script>
    // --- البيانات المستخرجة (100 اسم) ---
    const initialData = [

        { name: "محمد حسن باصم", points: 10 }, { name: "خالد عمر باحارث", points: 10 },
        { name: "انور محمد عديد", points: 10 }, { name: "علي عبدالله الغرابي", points: 10 },
        { name: "محمد احمد البحسني", points: 10 }, { name: "منيف علي اليزيدي", points: 10 },
        { name: "محمد زكي حبيشان", points: 8 }, { name: "سالم مبارك الكلالي", points: 8 },
        { name: "ابراهيم عماد بن عروة", points: 8 }, { name: "احمد علي العساني", points: 8 },
        { name: "عبدالرب حسن السعدي", points: 8 }, { name: "وليد عوض بخوخ", points: 8 },
        { name: "عبدالله عمر الكلالي", points: 8 }, { name: "محمد عبدالله الكلالي", points: 8 },
        { name: "محمد عمر الكلالي", points: 8 }, { name: "عبدالله ماجد جباري", points: 8 },
        { name: "عبدالله صالح الجابري", points: 8 }, { name: "سالم سعيد باعباد", points: 8 },
        { name: "وائل صالح بازياد", points: 8 }, { name: "علي صبري السعدي", points: 8 },
        { name: "عبدالله محمد الكلالي", points: 8 }, { name: "احمد كرامه باسيود", points: 7 },
        { name: "فرج عبدالرحمن الكسادي", points: 7 }, { name: "محمد احمد باعباد", points: 6 },
        { name: "عبدالقادر احمد بن عروة", points: 6 }, { name: "عمر محمد باوزير", points: 6 },
        { name: "مدين عوض باصلفة", points: 6 }, { name: "علي فؤاد الكلالي", points: 6 },
        { name: "علي عثمان باخوار", points: 6 }, { name: "سالم عوض علي بن عروة", points: 6 },
        { name: "عبدالرحمن عمر الشيخاني", points: 6 }, { name: "محسن حسن البحسني", points: 6 },
        { name: "ابراهيم عادل المقدي", points: 6 }, { name: "محمد صالح باصلفة", points: 6 },
        { name: "عبدالله ياسر العماري", points: 6 }, { name: "همام صالح الغرابي", points: 6 },
        { name: "عمار ياسر العماري", points: 6 }, { name: "محمد صالح بن اسحاق", points: 6 },
        { name: "احمد عبدالله السقاف", points: 6 }, { name: "سامي حاج باضريس", points: 6 },
        { name: "عبدالله سمير العمري", points: 6 }, { name: "عبدالله حسين شنظور", points: 6 },
        { name: "عوض محمد العبد", points: 6 }, { name: "احمد علي باعوضان", points: 6 },
        { name: "عمر فؤاد مفيتاح", points: 6 }, { name: "سالم محمد باوزير", points: 6 },
        { name: "محمد سبيتي بامؤمن", points: 5 }, { name: "احمد عبدالله باصالح", points: 4 },
        { name: "عبدالكريم جمعان بن ناصر", points: 4 }, { name: "ابراهيم علي باسعد", points: 4 },
        { name: "معاذ حسن باسيود", points: 4 }, { name: "علام احمد عديد", points: 4 },
        { name: "محمد علي باسعد", points: 4 }, { name: "سعيد سالم القرزي", points: 4 },
        { name: "احمد محمد عليو", points: 4 }, { name: "عبدالله عوض بن غدران", points: 4 },
        { name: "اسامه محفوظ بازياد", points: 4 }, { name: "عبدالرحمن طارق مثنى", points: 4 },
        { name: "محمد نديم المضني", points: 4 }, { name: "يوسف عبدالله عديد", points: 4 },
        { name: "هاني عبدالله عميران", points: 4 }, { name: "ياسر البرك النموري", points: 4 },
        { name: "عمر محمد بقرف", points: 4 }, { name: "فايز احمد باوشخة", points: 4 },
        { name: "احمد عوض الملفزي", points: 4 }, { name: "عبدالعزيز صالح واكد", points: 4 },
        { name: "عمر علي اليزيدي", points: 4 }, { name: "عبدالله صالح عديد", points: 4 },
        { name: "سعيد سالمين البحسني", points: 4 }, { name: "عبدالله خالد باهيري", points: 2 },
        { name: "محمد عبدالله الجابري", points: 2 }, { name: "عبدالله عثمان باخوار", points: 2 },
        { name: "سالم احمد حقص", points: 2 }, { name: "احمد عبدالله باسيود", points: 2 },
        { name: "محمد عمر باعباد", points: 2 }, { name: "عبدالله عوض علي بن عروة", points: 2 },
        { name: "معتز عبدالله كعيتي", points: 2 }, { name: "عمار سالم الصيعري", points: 2 },
        { name: "علي سالم بارعيده", points: 2 }, { name: "عبدالسلام خالد بن منيف", points: 2 },
        { name: "عوض سالم كعيتي", points: 2 }, { name: "محمد عبد الرحمن باهارون", points: 2 },
        { name: "علي محمد الذييبي", points: 2 }, { name: "محمد سعيد باعامر", points: 2 },
        { name: "عبدالرحمن سالم العليي", points: 2 }, { name: "احمد محمد الشاطري", points: 2 }
    ];

    // --- إعدادات الألوان ---
    const defaultColors = {
        'bg-page': '#f1f5fb', 'bg-table': '#0755bd', 'bg-row': '#ffffff',
        'bg-points': '#ffd700', 'text-main': '#172b45', 'border-main': '#dce7f7'
    };
    let currentColors = JSON.parse(localStorage.getItem('appColors')) || defaultColors;

    function applyColors() {
        for (let key in currentColors) {
            if(key === 'bg-page') document.body.style.backgroundColor = currentColors[key];
            if(key === 'bg-table') document.querySelectorAll('th').forEach(th => th.style.backgroundColor = currentColors[key]);
            if(key === 'bg-row') document.querySelectorAll('td').forEach(td => td.style.backgroundColor = currentColors[key]);
            if(key === 'bg-points') document.querySelectorAll('.points-input').forEach(inp => inp.style.backgroundColor = currentColors[key]);
            
            const input = document.getElementById('c-' + key.split('-')[1]); 
            if(input) input.value = currentColors[key];
        }
    }
    
    function changeColor(variableName, color) {
        currentColors[variableName] = color;
        localStorage.setItem('appColors', JSON.stringify(currentColors));
        applyColors();
        renderTable();
    }

    // --- إدارة البيانات ---
    localStorage.removeItem('appPlayers');
    let players = JSON.parse(JSON.stringify(initialData));
    localStorage.setItem('appPlayers', JSON.stringify(players));

    function saveData(showAlert = false) {
        localStorage.setItem('appPlayers', JSON.stringify(players));
        if(showAlert) alert('✅ تم حفظ جميع التعديلات بنجاح!');
    }

    function renderTable() {
        players.sort((a, b) => b.points - a.points);
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        players.forEach((player, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-size: 18px; color: var(--main);">${index + 1}</td>
                <td>
                    <input type="text" class="edit-input name-input" 
                           value="${player.name}" 
                           onchange="updatePlayer(${index}, 'name', this.value)">
                </td>
                <td>
                    <input type="number" class="edit-input points-input" 
                           value="${player.points}" 
                           onchange="updatePlayer(${index}, 'points', this.value)">
                </td>
                <td>
                    <button class="delete-btn" onclick="deletePlayer(${index})">✖</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
        document.getElementById('total').innerText = `إجمالي المشاركين: ${players.length}`;
        applyColors();
    }

    function updatePlayer(index, field, newValue) {
        if (field === 'name') {
            if (newValue.trim() !== "") { players[index].name = newValue.trim(); } 
            else { renderTable(); return; }
        } else if (field === 'points') {
            let points = parseInt(newValue);
            if (isNaN(points)) points = 0; 
            players[index].points = points;
        }
        saveData();
        renderTable(); 
    }

    function deletePlayer(index) {
        if(confirm(`هل أنت متأكد من حذف (${players[index].name})؟`)) {
            players.splice(index, 1);
            saveData();
            renderTable();
        }
    }

    // --- نظام الفرز والإضافة ---
    function cleanName(name) {
        return name.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F700}-\u{1F77F}\u{1F780}-\u{1F7FF}\u{1F800}-\u{1F8FF}\u{1F900}-\u{1F9FF}\u{1FA00}-\u{1FA6F}\u{1FA70}-\u{1FAFF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '').trim();
    }

    function parseNames() {
        const text = document.getElementById('bulkNames').value;
        if (!text.trim()) return alert('يرجى لصق الأسماء أولاً');

        const rawNames = text.split(/[،,\n]+/);
        const parsedItemsContainer = document.getElementById('parsedItems');
        parsedItemsContainer.innerHTML = '';
        let validNamesCount = 0;

        rawNames.forEach(rawName => {
            let clean = cleanName(rawName);
            if (clean.length > 2) { 
                validNamesCount++;
                const div = document.createElement('div');
                div.className = 'parsed-item';
                div.innerHTML = `
                    <span>${clean}</span>
                    <input type="number" class="item-points" data-name="${clean}" placeholder="النقاط">
                `;
                parsedItemsContainer.appendChild(div);
            }
        });

        if (validNamesCount > 0) {
            document.getElementById('parsedContainer').style.display = 'block';
            // إظهار زر الواتساب بمجرد فرز الأسماء
            document.getElementById('whatsappCongratsBtn').style.display = 'block';
        } else {
            alert('لم يتم التعرف على أي أسماء صالحة.');
        }
    }

    // دالة التهنئة عبر الواتساب
    function sendCongratulations() {
        const inputs = document.querySelectorAll('.item-points');
        let namesList = [];
        
        inputs.forEach(input => {
            const name = input.getAttribute('data-name');
            if(name) namesList.push(name);
        });

        if(namesList.length === 0) {
            return alert('لا توجد أسماء لتهنئتها.');
        }

        let message = "🎉 *ألف مبروك التوقع الصحيح!* 🎉\n\n";
        message += "نهنئكم على التوقع الصحيح في دوري تحدي التوقعات:\n\n";
        
        namesList.forEach((name, index) => {
            message += `⭐ ${name}\n`;
        });
        
        message += "\n🏆 *صدى العندليب - معاً نحو القمة* 🏆";

        const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(message)}`;
        window.open(whatsappUrl, '_blank');
    }

    function applyParsedNames() {
        const defaultPointsInput = document.getElementById('defaultPoints').value;
        const defaultPoints = parseInt(defaultPointsInput) || 0;
        
        const inputs = document.querySelectorAll('.item-points');
        let added = 0, updated = 0;

        inputs.forEach(input => {
            const name = input.getAttribute('data-name');
            let points = input.value.trim() !== "" ? parseInt(input.value) : defaultPoints;
            if (isNaN(points)) points = 0;

            const existing = players.find(p => p.name === name);
            if (existing) {
                existing.points += points; 
                updated++;
            } else {
                players.push({ name: name, points: points }); 
                added++;
            }
        });

        document.getElementById('parsedContainer').style.display = 'none';
        document.getElementById('whatsappCongratsBtn').style.display = 'none'; // إخفاء الزر بعد الإضافة
        document.getElementById('bulkNames').value = '';
        
        saveData();
        renderTable();
        
        alert(`✅ تم الاعتماد بنجاح!\nأسماء جديدة: ${added}\nأسماء مكررة تم تحديثها: ${updated}`);
    }

    function addName() {
        const nameInput = document.getElementById('inputName');
        const pointsInput = document.getElementById('inputPoints');
        let name = nameInput.value.trim();
        const points = parseInt(pointsInput.value) || 0;

        if (!name) return alert('يرجى كتابة الاسم');
        name = cleanName(name);

        const existing = players.find(p => p.name === name);
        if (existing) { existing.points += points; } 
        else { players.push({ name: name, points: points }); }
        
        nameInput.value = '';
        pointsInput.value = '0';
        saveData();
        renderTable();
    }

    function resetPoints() {
        if(confirm('هل أنت متأكد من تصفير جميع النقاط؟ (ستبقى الأسماء في القائمة)')) {
            players.forEach(p => p.points = 0);
            saveData();
            renderTable();
        }
    }

    function clearAll() {
        if(confirm('هل تريد مسح جميع الأسماء والبيانات نهائياً؟')) {
            players = [];
            saveData();
            renderTable();
        }
    }

    function shareWhatsApp() {
        if(players.length === 0) return alert('لا توجد بيانات');
        let text = "🏆 *ترتيب التوقعات* 🏆\n\n";
        players.forEach((p, i) => {
            text += `${i + 1}- ${p.name} : *${p.points}* نقطة\n`;
        });
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    }

    // --- التبويبات ---
    function showTab(which) {
        const isSort = which === "sort";
        document.getElementById('sortPane').classList.toggle("active", isSort);
        document.getElementById('rankPane').classList.toggle("active", !isSort);
        document.getElementById('sortTab').classList.toggle("active", isSort);
        document.getElementById('rankTab').classList.toggle("active", !isSort);
        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // تشغيل النظام
    document.addEventListener('DOMContentLoaded', () => {
        renderTable();
    });
</script>
</body>
</html>
